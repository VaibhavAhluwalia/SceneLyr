[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "scenelyr"
version = "0.1.0"
description = "Deterministic semantic visual compiler and diagram importer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "mcp>=1.15,<2",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5.1",
  "pydantic>=2.10,<3",
  "python-pptx>=1.0,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "pytest-cov>=6,<8"]

[project.scripts]
scenelyr = "scenelyr.cli:main"
scenelyr-mcp = "scenelyr.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scenelyr"]

[tool.hatch.build.targets.wheel.force-include]
"src/scenelyr/ocr.swift" = "scenelyr/ocr.swift"

[tool.pytest.ini_options]
testpaths = ["tests_py"]
addopts = "-q"
